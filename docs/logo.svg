<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Expression logo</title>
  <desc id="description">A composed letter E made from three rounded pipeline strokes.</desc>
  <defs>
    <linearGradient id="flow" x1="40" y1="128" x2="208" y2="128" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14B8A6"/>
      <stop offset=".54" stop-color="#2E5BCE"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F1D5C" flood-opacity=".18"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M48 60H192" stroke="url(#flow)" stroke-width="24"/>
    <path d="M48 128H168" stroke="url(#flow)" stroke-width="24"/>
    <path d="M48 196H192" stroke="url(#flow)" stroke-width="24"/>
    <path d="M104 60V196" stroke="#14255E" stroke-width="24"/>
  </g>
  <g fill="#14B8A6">
    <circle cx="48" cy="60" r="8"/>
    <circle cx="48" cy="128" r="8"/>
    <circle cx="48" cy="196" r="8"/>
  </g>
</svg>
