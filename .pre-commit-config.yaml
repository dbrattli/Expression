exclude: "_version.py|versioneer.py"
repos:
  - repo: local
    hooks:
      - id: prevent-readme-edits
        name: Prevent direct README.md edits
        entry: .pre-commit-hooks/prevent-readme-edits.sh
        language: script
        files: README\.md$

  - hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        args: [--check]
    repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
  - hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: node
        pass_filenames: false
        types: [python]
        additional_dependencies: ["pyright@1.1.413"]
    repo: local
