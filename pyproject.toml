[project]
name = "Expression"
dynamic = ["version"]
description = "Practical functional programming for Python 3.10+"
readme = "README.md"
requires-python = ">=3.10,<4"
authors = [
    { name = "Dag Brattli", email = "dag.brattli@cognite.com" },
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Other Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typing-extensions>=4.6.0",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2.6.2,<3.0.0"]
all = ["pydantic>=2.6.2,<3.0.0"]

[project.urls]
Homepage = "https://github.com/cognitedata/Expression"

[tool.poetry]
version = "0.0.0" # NOTE: updated by the publish workflow

[tool.poetry.group.dev.dependencies]
pytest-asyncio = "^1.4.0"
pytest = "^9.1.1"
coverage = "^7.15.4"
coveralls = "^4.1.0"
pre-commit = "^4.6.2"
dunamai = "^1.26.2"
hypothesis = "^6.165.9"
ruff = "^0.16.3"
jupytext = "^1.19.5"


[tool.ruff]
# Keep in sync with .pre-commit-config.yaml
line-length = 120
target-version = "py310"
# D100: Missing docstring in public module
# D104: Missing docstring in public package
# D105: Missing docstring in magic method
lint.ignore = ["D100", "D101", "D102", "D103", "D105", "D107"]
lint.select = ["D", "E", "W",  "F", "I", "T", "RUF", "TID", "UP"]
exclude = ["tests", "docs"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
lines-after-imports = 2
known-third-party = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core>=2.4.1,<3.0.0"]
build-backend = "poetry.core.masonry.api"
